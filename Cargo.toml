[package]
name = "rustshot-wayland"
version = "0.1.0"
edition = "2021"
description = "RustShot for Wayland / Omarchy (Hyprland): region select, annotate, save/copy"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"

zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
ksni = "0.3"

smithay-client-toolkit = "0.19"
wayland-client = "0.31"
libc = "0.2"
libwayshot = { version = "0.9", default-features = false }

image = { version = "0.25", default-features = false, features = ["png", "pnm"] }
tiny-skia = "0.11"
imageproc = "0.25"
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
